<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dev/null — Community Globe</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050b16; color: #f4f7fb; font: 14px system-ui, sans-serif; overflow: hidden; }
    #globe { width: 100vw; height: 100vh; }
    .panel { position: fixed; top: 20px; left: 20px; z-index: 1000000; isolation: isolate; padding: 16px 20px; background: #091321dd; border: 1px solid #31415b; border-radius: 14px; max-width: min(400px, calc(100vw - 40px)); }
    h1 { font-size: 20px; margin: 0; }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .collapse-toggle { margin:0; padding:7px 11px; flex-shrink:0; background:#15263d; font-size:13px; }
    .panel-content { margin-top:10px; }
    .panel.collapsed .panel-content { display:none; }
    .panel.collapsed { padding:12px 15px; }
    .panel.collapsed .collapse-toggle { background:#17568c; }
    @media (max-width:650px) {
      .panel { top: max(10px, env(safe-area-inset-top)); left:12px; right:12px; max-width:none; padding:12px 14px; border-radius:16px; }
      .panel h1 { font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .lookup { flex-wrap:wrap; }
      .lookup input { flex-basis:100%; }
      .lookup button { margin:0; width:100%; }
      .panel-content { max-height: min(65dvh, 480px); overflow-y:auto; overscroll-behavior:contain; }
      .actions button { flex:1; margin-top:4px; }
      .profile-card { max-height:75dvh; overflow-y:auto; }
    }
    .lookup { display: flex; gap: 8px; margin: 12px 0; }
    .lookup input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid #536986; background: #101e32; color: white; }
    .lookup button { margin: 0; }
    .mode-switch { display: flex; gap: 6px; margin: 8px 0 12px; }
    .mode-switch button { flex: 1; margin: 0; padding: 9px 12px; background: #15263d; border-color: #425a77; }
    .mode-switch button[aria-pressed="true"] { background: #17568c; border-color: #65b7ff; }
    #status { color: #b7c6dc; line-height: 1.5; }
    #error { color: #ff9e9e; margin-top: 8px; }
    /* Circular avatar markers (restored from before the map-pin change). */
    .person { position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 3px; cursor: default; transform: translate(-50%, -50%); background: #10233c; border: 2px solid #65b7ff; border-radius: 50%; box-shadow: 0 0 12px #299cff88; pointer-events: auto !important; }
    .person img { display: block; width: 36px; height: 36px; flex-shrink: 0; object-fit: cover; border-radius: 50%; background: #243750; }
    .person .details { display: none !important; }
    .person .details-unused { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .person .username { font-size: 12px; font-weight: 700; }
    .person .location { font-size: 11px; font-weight: 400; color: #b8d9ff; display: flex; align-items: center; gap: 3px; }
    .person .location .pin { color: #ff7474; font-size: 12px; }
    .person:hover { border-color: #84d9ed; box-shadow: 0 0 18px #299cffbb; }
    body.profile-active .person { opacity: .25; transition: opacity .18s ease; }
    body.profile-active .person.profile-selected { opacity: 1; filter: drop-shadow(0 0 9px #299cffaa); }
    .person { pointer-events: auto !important; }
    #globe .scene-container > div { pointer-events: none; }
    #globe .scene-container .person { pointer-events: auto !important; }
    .profile-card { position: fixed; z-index: 2147483647; isolation: isolate; width: min(340px, calc(100vw - 24px)); padding: 17px; border: 1px solid #65b7ff; border-radius: 18px; background: #0b1829f5; box-shadow: 0 14px 45px #000a, 0 0 24px #299cff44; color: #f4f7fb; display: none; pointer-events: auto; }
    .profile-card.visible { display: block; }
    .profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .profile-head img { width: 66px; height: 66px; border-radius: 50%; object-fit: cover; border: 2px solid #65b7ff; }
    .profile-head strong { font-size: 19px; display: block; overflow-wrap: anywhere; }
    .profile-handle { color: #8acbff; font-size: 13px; }
    .profile-location { color: #c5d5ea; margin: 8px 0; }
    .profile-bio { line-height: 1.5; margin: 10px 0; white-space: normal; overflow-wrap: anywhere; }
    .profile-company { color: #a9bed7; margin-bottom: 12px; }
    .profile-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .profile-links a { color: #fff; text-decoration: none; border: 1px solid #508fc7; background: #17446e; padding: 8px 10px; border-radius: 9px; font-weight: 600; }
    .profile-links a:hover { background: #23659d; }
    button { margin-top: 12px; padding: 10px 15px; border: 1px solid #65b7ff; border-radius: 9px; color: white; background: #17568c; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .actions button { margin-top: 12px; }
    #auto { background: #24364c; }
    .hint { margin-top: 8px; font-size: 11px; color: #879bb7; }
    .credit { margin-top: 14px; font-size: 12px; color: #9cb0cc; }
    .credit a { color: #77c4ff; text-decoration: none; font-weight: 600; }
    .credit a:hover { text-decoration: underline; }
    #pastry-sprinkles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
    .pastry { position: absolute; width: var(--size); height: var(--size); opacity: .68; filter: drop-shadow(0 0 8px #ffd58b55); animation: pastry-float var(--duration) ease-in-out infinite alternate; animation-delay: var(--delay); }
    @keyframes pastry-float { from { transform: translate3d(0, 0, 0) rotate(-12deg); } to { transform: translate3d(12px, -28px, 0) rotate(16deg); } }
    @media (prefers-reduced-motion: reduce) { .pastry { animation: none; } }
    @media (max-width: 650px) { .pastry { opacity: .4; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
  <!-- Deployment refresh: Cloudflare static site -->
</head>
<body>
  <div class="panel">
    <div class="panel-heading">
      <h1 id="heading">🌍 Tom's Following</h1>
      <button id="collapse-toggle" class="collapse-toggle" type="button" aria-expanded="true" aria-controls="panel-content">Hide ▲</button>
    </div>
    <div id="panel-content" class="panel-content">
    <form class="lookup" id="lookup"><input id="handle" aria-label="dev/null username" placeholder="Enter username" value="tom" maxlength="64" required pattern="[A-Za-z0-9_-]+" /><button type="submit">Show globe</button></form>
    <div class="mode-switch" role="group" aria-label="Choose relationship">
      <button type="button" data-mode="following" aria-pressed="true">Following</button>
      <button type="button" data-mode="followers" aria-pressed="false">Followers</button>
    </div>
    <div id="status">Loading users…</div>
    <div id="error"></div>
    <div class="actions"><button id="more" type="button" disabled>Load 30 more</button><button id="auto" type="button" aria-pressed="true">⏸ Pause auto-load</button></div>
    <div id="countdown" class="hint" aria-live="polite"></div>
    <div class="hint">Drag to rotate · Scroll to zoom</div>
    <div class="credit">Vibe-coded by <a href="https://dev-null.sh/@richardkeep" target="_blank" rel="noopener noreferrer">@richardkeep</a></div>
    </div>
  </div>
  <div id="globe"></div>
  <div id="pastry-sprinkles" aria-hidden="true"></div>
  <div id="profile-card" class="profile-card" role="dialog" aria-label="User details"></div>
  <script>
    // Keep controls collapsed by default on mobile; remember preference on this device.
    const panel = document.querySelector('.panel');
    const collapseToggle = document.getElementById('collapse-toggle');
    const panelPreferenceKey = 'dev-null-globe-panel-collapsed';
    const savedPanelPreference = localStorage.getItem(panelPreferenceKey);
    let panelCollapsed = savedPanelPreference === null
      ? window.matchMedia('(max-width: 650px)').matches
      : savedPanelPreference === 'true';
    function renderPanel() {
      panel.classList.toggle('collapsed', panelCollapsed);
      collapseToggle.textContent = panelCollapsed ? 'Show ▼' : 'Hide ▲';
      collapseToggle.setAttribute('aria-expanded', String(!panelCollapsed));
      document.getElementById('panel-content').inert = panelCollapsed;
    }
    collapseToggle.addEventListener('click', () => {
      panelCollapsed = !panelCollapsed;
      try { localStorage.setItem(panelPreferenceKey, String(panelCollapsed)); } catch {}
      renderPanel();
    });
    renderPanel();

    // Decorative pastries are independent of the globe and API requests.
    const sprinkleLayer = document.getElementById('pastry-sprinkles');
    const sprinklePositions = [[7,74,33],[16,88,42],[35,93,30],[60,84,38],[83,89,33],[93,67,44],[87,22,31],[65,7,30],[38,9,35],[8,43,32]];
    sprinklePositions.forEach(([x, y, size], i) => {
      const pastry = document.createElement('img');
      pastry.className = 'pastry';
      pastry.src = 'https://dev-null.sh/pastel-de-nata.svg';
      pastry.alt = '';
      pastry.loading = 'lazy';
      pastry.style.left = `${x}%`;
      pastry.style.top = `${y}%`;
      pastry.style.setProperty('--size', `${size}px`);
      pastry.style.setProperty('--duration', `${5 + i % 4}s`);
      pastry.style.setProperty('--delay', `${-i * 0.7}s`);
      sprinkleLayer.appendChild(pastry);
    });

    const API_BASE = `${location.origin}/api/v1/users/`;
    const storageKey = (handle, mode) => `dev-null-${mode}-globe-v2:${handle.toLowerCase()}`;
    let currentHandle = 'tom';
    let currentMode = 'following';
    let STORAGE_KEY = storageKey(currentHandle, currentMode);
    let API_URL = `${API_BASE}${encodeURIComponent(currentHandle)}/${currentMode}`;
    let sessionId = 0;
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const globe = Globe()(document.getElementById('globe'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlAltitude(0.035)
      .htmlElement(createMarker);

    globe.pointOfView({ lat: 10, lng: 15, altitude: 2.3 });
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.25;
    window.addEventListener('resize', () => globe.width(innerWidth).height(innerHeight));

    const profileCard = document.getElementById('profile-card');
    let hoverHideTimer;
    let activeUser = null;
    const safeUrl = value => {
      try { const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : null; }
      catch { return null; }
    };
    function addProfileLink(container, label, url) {
      const href = safeUrl(url);
      if (!href) return;
      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = label;
      container.appendChild(a);
    }
    function showProfile(user, x, y) {
      clearTimeout(hoverHideTimer);
      if (activeUser !== user) {
        activeUser = user;
        profileCard.replaceChildren();
        const head = document.createElement('div'); head.className = 'profile-head';
        const avatar = document.createElement('img');
        avatar.alt = ''; avatar.referrerPolicy = 'no-referrer';
        avatar.src = user.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name);
        const identity = document.createElement('div');
        const name = document.createElement('strong'); name.textContent = user.name;
        const handle = document.createElement('span'); handle.className = 'profile-handle'; handle.textContent = '@' + user.handle;
        identity.append(name, handle); head.append(avatar, identity); profileCard.appendChild(head);
        if (user.location) {
          const location = document.createElement('div'); location.className = 'profile-location';
          location.textContent = '📍 ' + user.location; profileCard.appendChild(location);
        }
        if (user.bio) {
          const bio = document.createElement('div'); bio.className = 'profile-bio';
          bio.textContent = user.bio; profileCard.appendChild(bio);
        }
        if (user.company) {
          const company = document.createElement('div'); company.className = 'profile-company';
          company.textContent = '🏢 ' + user.company; profileCard.appendChild(company);
        }
        const links = document.createElement('div'); links.className = 'profile-links';
        addProfileLink(links, '↗ /dev/null profile', user.html_url || `https://dev-null.sh/@${encodeURIComponent(user.handle)}`);
        if (user.github_url) addProfileLink(links, '↗ GitHub', user.github_url);
        if (user.website) addProfileLink(links, '↗ Website', user.website);
        profileCard.appendChild(links);
      }
      profileCard.classList.add('visible');
      document.body.classList.add('profile-active');
      document.querySelectorAll('.person.profile-selected').forEach(el => el.classList.remove('profile-selected'));
      document.querySelectorAll('.person').forEach(el => {
        if (el.dataset.handle === user.handle) el.classList.add('profile-selected');
      });
      globe.controls().autoRotate = false;
      const rect = profileCard.getBoundingClientRect();
      const left = Math.max(12, Math.min(x + 16, innerWidth - rect.width - 12));
      const top = Math.max(12, Math.min(y + 16, innerHeight - rect.height - 12));
      profileCard.style.left = left + 'px'; profileCard.style.top = top + 'px';
    }
    function hideProfileSoon() {
      clearTimeout(hoverHideTimer);
      hoverHideTimer = setTimeout(() => {
        profileCard.classList.remove('visible');
        document.body.classList.remove('profile-active');
        document.querySelectorAll('.person.profile-selected').forEach(el => el.classList.remove('profile-selected'));
        activeUser = null;
        globe.controls().autoRotate = true;
      }, 260);
    }
    profileCard.addEventListener('pointerenter', () => clearTimeout(hoverHideTimer));
    profileCard.addEventListener('pointerleave', hideProfileSoon);

    function createMarker(user) {
      const el = document.createElement('div');
      el.className = 'person';
      el.dataset.handle = user.handle;
      if (activeUser?.handle === user.handle) el.classList.add('profile-selected');
      const img = document.createElement('img');
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.src = user.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name);
      img.onerror = () => { img.onerror = null; img.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name); };
      el.setAttribute('aria-label', user.name + (user.location ? ', ' + user.location : ''));
      el.appendChild(img);
      el.addEventListener('pointerenter', e => showProfile(user, e.clientX, e.clientY));
      el.addEventListener('pointerleave', hideProfileSoon);
      el.addEventListener('focusin', () => { const r = el.getBoundingClientRect(); showProfile(user, r.right, r.top); });
      el.addEventListener('focusout', hideProfileSoon);
      el.tabIndex = 0;
      // Marker clicks do not navigate; profile links live inside the hover card.
      return el;
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    const geoCache = new Map();
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          plotted, seenHandles: [...seenHandles], visitedPages: [...visitedPages],
          nextUrl, skipped, loaded, geo: [...geoCache], autoPaused
        }));
      } catch (e) { console.warn('Unable to save globe cache:', e); }
    }
    function restoreState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const state = JSON.parse(raw);
        if (!Array.isArray(state.plotted) || !Array.isArray(state.seenHandles)) return false;
        plotted.push(...state.plotted.filter(u => Number.isFinite(u.lat) && Number.isFinite(u.lng)));
        state.seenHandles.forEach(h => seenHandles.add(h));
        (state.visitedPages || []).forEach(url => visitedPages.add(url));
        (state.geo || []).forEach(([key, point]) => geoCache.set(key, point));
        nextUrl = typeof state.nextUrl === 'string' ? state.nextUrl : null;
        skipped = Number(state.skipped) || 0;
        loaded = Number(state.loaded) || 0;
        autoPaused = state.autoPaused === true;
        updateAutoButton();
        globe.htmlElementsData([...plotted]);
        statusEl.textContent = `${plotted.length} on globe · ${skipped} not plotted · ${loaded} fetched (restored)`;
        moreButton.disabled = !nextUrl;
        moreButton.textContent = nextUrl ? 'Load 30 more' : 'All pages loaded';
        scheduleAutoLoad();
        return true;
      } catch (e) { console.warn('Unable to restore globe cache:', e); return false; }
    }

    async function geocode(location) {
      const key = location.trim().toLowerCase();
      if (geoCache.has(key)) return geoCache.get(key);
      // Nominatim is suitable only for small, low-volume demonstrations.
      // Production apps should geocode server-side and cache coordinates.
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(location)}`);
      if (!response.ok) throw new Error(`Geocoding failed (${response.status})`);
      const results = await response.json();
      const point = results.length ? { lat: Number(results[0].lat), lng: Number(results[0].lon) } : null;
      geoCache.set(key, point);
      return point;
    }

    function normalizeUser(u) {
      const location = typeof u.location === 'string' ? u.location : (u.location?.name || u.city || u.country || '');
      const lat = Number(u.latitude ?? u.lat ?? u.location?.latitude);
      const lng = Number(u.longitude ?? u.lng ?? u.lon ?? u.location?.longitude);
      return {
        handle: u.handle || u.username || '',
        name: u.name || u.display_name || u.handle || u.username || 'Unknown user',
        avatar: u.avatar_url || u.avatar || u.profile_image_url || '',
        bio: u.bio || '',
        company: u.company || '',
        github_url: u.github_url || '',
        html_url: u.html_url || '',
        website: u.website || '',
        location,
        lat: Number.isFinite(lat) && (u.latitude != null || u.lat != null || u.location?.latitude != null) ? lat : null,
        lng: Number.isFinite(lng) && (u.longitude != null || u.lng != null || u.lon != null || u.location?.longitude != null) ? lng : null
      };
    }

    const moreButton = document.getElementById('more');
    const autoButton = document.getElementById('auto');
    const countdownEl = document.getElementById('countdown');
    const AUTO_DELAY_MS = 3000;
    let autoPaused = false;
    let autoTimer = null;
    let countdownTimer = null;
    let nextAutoAt = 0;

    function clearAutoTimers() {
      clearTimeout(autoTimer);
      clearInterval(countdownTimer);
      autoTimer = null;
      countdownTimer = null;
      countdownEl.textContent = '';
    }
    function updateAutoButton() {
      autoButton.textContent = autoPaused ? '▶ Resume auto-load' : '⏸ Pause auto-load';
      autoButton.setAttribute('aria-pressed', String(!autoPaused));
      autoButton.disabled = !nextUrl;
    }
    function scheduleAutoLoad() {
      clearAutoTimers();
      updateAutoButton();
      if (autoPaused || loading || !nextUrl) {
        if (autoPaused && nextUrl) countdownEl.textContent = 'Automatic loading paused';
        return;
      }
      const scheduledSession = sessionId;
      nextAutoAt = Date.now() + AUTO_DELAY_MS;
      const tick = () => {
        if (scheduledSession !== sessionId || autoPaused) return;
        countdownEl.textContent = `Loading 30 more devs in ${Math.max(0, Math.ceil((nextAutoAt - Date.now()) / 1000))}s`;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
      autoTimer = setTimeout(() => {
        clearAutoTimers();
        if (scheduledSession === sessionId && !autoPaused) loadNextPage();
      }, AUTO_DELAY_MS);
    }
    autoButton.addEventListener('click', () => {
      autoPaused = !autoPaused;
      saveState();
      scheduleAutoLoad();
    });
    const plotted = [];
    const seenHandles = new Set();
    const visitedPages = new Set();
    let nextUrl = API_URL;
    let loading = false;
    let skipped = 0;
    let loaded = 0;

    async function loadNextPage() {
      if (loading || !nextUrl) return;
      clearAutoTimers();
      const session = sessionId;
      loading = true;
      moreButton.disabled = true;
      errorEl.textContent = '';
      const url = nextUrl;
      statusEl.textContent = `Loading next page… ${plotted.length} plotted so far`;

      let succeeded = false;
      try {
        // Normalize upstream pagination links through our same-origin shared cache.
        const pageUrl = new URL(url, location.origin);
        if (pageUrl.origin !== location.origin && pageUrl.origin !== 'https://dev-null.sh') throw new Error('Unexpected pagination URL');
        const response = await fetch(`${location.origin}${pageUrl.pathname}${pageUrl.search}`, { headers: { Accept: 'application/json' } });
        if (!response.ok) {
          if (response.status === 429) {
            const retryAfter = response.headers.get('Retry-After');
            throw new Error(`Rate limited (429). Wait ${retryAfter ? retryAfter + ' seconds' : 'a while'} before clicking again.`);
          }
          const source = response.headers.get('X-Globe-Error-Source');
          const reason = source === 'origin' ? 'dev-null.sh API' : source === 'worker' ? 'Cloudflare Worker' : 'API or proxy';
          let detail = '';
          if (source === 'worker') {
            try { detail = (await response.json()).detail || ''; } catch (_) {}
          }
          throw new Error(`${reason} returned HTTP ${response.status}${detail ? ': ' + detail : ''}`);
        }
        const json = await response.json();
        if (session !== sessionId) return;
        const items = Array.isArray(json) ? json :
          (Array.isArray(json.data) ? json.data :
          (Array.isArray(json.data?.users) ? json.data.users : json.users));
        if (!Array.isArray(items)) throw new Error('Unexpected API response structure');

        visitedPages.add(url);
        const next = json.links?.next || json.next_page_url || json.meta?.next_page_url;
        const candidate = next ? new URL(next, url).href : null;
        nextUrl = candidate && !visitedPages.has(candidate) ? candidate : null;
        loaded += items.length;

        for (const item of items) {
          if (session !== sessionId) return;
          const user = normalizeUser(item);
          if (!user.handle || seenHandles.has(user.handle)) continue;
          seenHandles.add(user.handle);
          // Skip developers with no profile location, even when coordinates exist.
          if (!user.location || !String(user.location).trim()) { skipped++; continue; }
          if (user.lat == null || user.lng == null) {
            if (!user.location) { skipped++; continue; }
            try {
              const point = await geocode(user.location);
              if (session !== sessionId) return;
              if (!point) { skipped++; continue; }
              Object.assign(user, point);
              // Nominatim public API: at most 1 request per second.
              await sleep(1100);
            } catch (err) {
              console.warn('Geocoding unavailable:', user.location, err);
              skipped++;
              continue;
            }
          }
          plotted.push(user);
          globe.htmlElementsData([...plotted]);
          statusEl.textContent = `${plotted.length} on globe · ${skipped} without locations · ${loaded} fetched`;
        }
        statusEl.textContent = `${plotted.length} on globe · ${skipped} not plotted · ${loaded} fetched`;
        succeeded = true;
        saveState();
      } catch (err) {
        console.error(err);
        if (session !== sessionId) return;
        errorEl.textContent = err.message;
        // Never retry failed pages automatically (especially HTTP 429).
        autoPaused = true;
        saveState();
        statusEl.textContent = `${plotted.length} users on globe. Could not load next page.`;
      } finally {
        if (session !== sessionId) return;
        loading = false;
        moreButton.disabled = !nextUrl;
        moreButton.textContent = nextUrl ? 'Load 30 more' : 'All pages loaded';
        if (succeeded) scheduleAutoLoad();
        else updateAutoButton();
      }
    }

    function switchUser(handle, mode = currentMode) {
      const clean = handle.trim().replace(/^@/, '').toLowerCase();
      if (!/^[a-z0-9_-]+$/.test(clean)) {
        errorEl.textContent = 'Enter a valid username (letters, numbers, underscores or hyphens).';
        return;
      }
      if (!['following', 'followers'].includes(mode)) mode = 'following';
      if (clean === currentHandle && mode === currentMode && (loaded || loading)) return;
      clearAutoTimers();
      sessionId++;
      currentHandle = clean;
      currentMode = mode;
      STORAGE_KEY = storageKey(clean, mode);
      API_URL = `${API_BASE}${encodeURIComponent(clean)}/${mode}`;
      document.getElementById('heading').textContent = `🌍 ${clean}'s ${mode === 'followers' ? 'Followers' : 'Following'}`;
      document.querySelectorAll('[data-mode]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      });
      document.getElementById('handle').value = clean;
      history.replaceState(null, '', `${location.pathname}?user=${encodeURIComponent(clean)}&mode=${mode}${location.hash}`);
      plotted.length = 0;
      seenHandles.clear();
      visitedPages.clear();
      geoCache.clear();
      nextUrl = API_URL;
      skipped = 0;
      loaded = 0;
      loading = false;
      autoPaused = false;
      updateAutoButton();
      globe.htmlElementsData([]);
      errorEl.textContent = '';
      statusEl.textContent = 'Loading users…';
      moreButton.disabled = true;
      if (!restoreState()) loadNextPage();
    }
    document.getElementById('lookup').addEventListener('submit', event => {
      event.preventDefault();
      switchUser(document.getElementById('handle').value);
    });
    moreButton.addEventListener('click', loadNextPage);
    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => switchUser(currentHandle, button.dataset.mode));
    });
    const params = new URLSearchParams(location.search);
    const initial = params.get('user') || 'tom';
    switchUser(initial, params.get('mode') === 'followers' ? 'followers' : 'following');
  </script>
</body>
</html>
